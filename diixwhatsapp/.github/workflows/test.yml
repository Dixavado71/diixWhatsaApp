name: Tests e CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  test:
    name: 🧪 Executar Testes
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: diixwhatsapp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔨 Gerar Prisma Client
        run: npm run db:generate

      - name: 🗄️ Rodar migrações do banco
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/diixwhatsapp_test
        run: npm run db:migrate

      - name: 🧪 Executar todos os testes
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/diixwhatsapp_test
          SESSION_SECRET: test-session-secret-key-12345678901234567890
          CSRF_SECRET: test-csrf-secret-key-12345678901234567890
          NODE_ENV: test
        run: npm test

      - name: 📊 Gerar relatório de cobertura
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/diixwhatsapp_test
          SESSION_SECRET: test-session-secret-key-12345678901234567890
          CSRF_SECRET: test-csrf-secret-key-12345678901234567890
          NODE_ENV: test
        run: node --test --experimental-test-coverage

      - name: 📁 Upload do relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  lint:
    name: 🔍 Verificar Qualidade do Código
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔍 Verificar sintaxe dos arquivos de teste
        run: |
          node --check tests/helpers.js
          node --check tests/isolation.test.js
          node --check tests/integration/api.test.js
          node --check tests/unit/repositories.test.js
          node --check tests/unit/validators.test.js

  security:
    name: 🔒 Verificação de Segurança
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔒 Auditoria de vulnerabilidades
        run: npm audit --audit-level=moderate
        continue-on-error: true

  build:
    name: 🏗️ Verificar Build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔨 Gerar Prisma Client
        run: npm run db:generate

      - name: ✅ Verificar se o build é bem-sucedido
        run: echo "Build verificado com sucesso"
